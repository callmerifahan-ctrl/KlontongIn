<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KlontongIn - Inventori</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image/logo-warungku.png">
    
    <!-- Meta PWA & iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D67A67">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="KlontongIn">
    <link rel="apple-touch-icon" href="image/logo-warungku.png">

    <!-- Library OCR Gratisan Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header Logo -->
        <div class="header-logo" style="text-align: center; margin-bottom: 20px;">
            <img src="image/logo-warungku.png" alt="KlontongIn Logo" class="brand-logo">
            <h1>KlontongIn</h1>
        </div>

        <nav class="main-nav">
            <a href="index.html" class="nav-link active">📦 Inventori</a>
            <a href="cashier.html" class="nav-link">🛒 Kasir</a>
            <a href="debts.html" class="nav-link">📝 Bon / Utang</a>
            <a href="history.html" class="nav-link">📋 Riwayat Transaksi</a>
            <a href="report.html" class="nav-link">📊 Laporan</a>
        </nav>

        <!-- Tombol Akses Cepat (Foto & Tambah Barang) -->
        <div class="card" style="margin-bottom: 20px; display: flex; gap: 10px;">
            <label for="cameraInput" class="btn btn-primary" style="flex: 1; text-align: center; cursor: pointer; font-weight: bold; margin: 0;">
                📷 Foto / Scan Barang
            </label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
            
            <button id="btnToggleForm" class="btn" style="flex: 1; background: #27ae60; color: white; font-weight: bold;">
                ➕ Tambah Barang Baru
            </button>
        </div>
        <small id="statusOCR" style="display: none; margin-top: -10px; margin-bottom: 15px; font-weight: bold; font-size: 13px; text-align: center;"></small>

        <!-- Form Tambah / Edit Barang (Hidden Default) -->
        <div id="formContainer" class="form-box" style="display: none; margin-bottom: 20px;">
            <h2 id="formTitle">➕ Tambah Barang Baru</h2>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                <input type="hidden" id="itemImageUrl">

                <div class="form-group">
                    <label for="namaBarang">Nama Barang / Produk:*</label>
                    <input type="text" id="namaBarang" required placeholder="Contoh: Es Krim Frost Bite Cookies">
                </div>

                <div class="form-group">
                    <label for="kategoriBarang">Kategori Produk:*</label>
                    <select id="kategoriBarang" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box;" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="Sembako">🌾 Sembako & Bahan Pokok</option>
                        <option value="Mie Instan">🍜 Mie Instan & Olahan</option>
                        <option value="Minuman">🥤 Minuman & Galon</option>
                        <option value="Snack">🍿 Jajanan & Snack</option>
                        <option value="Rokok">🚬 Rokok & Tembakau</option>
                        <option value="Perlengkapan">🧼 Mandi & Cuci</option>
                        <option value="Pendingin">🍦 Es Krim & Pendingin</option>
                        <option value="Obat">💊 Obat & Kesehatan</option>
                        <option value="Rumah Tangga">🔥 Gas & Kebutuhan Rumah</option>
                        <option value="Lainnya">📦 Lain-lain</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="barcodeInput">Kode Barcode / Kode Batang (Opsional):</label>
                    <input type="text" id="barcodeInput" placeholder="Scan/Ketik nomor barcode kemasan...">
                </div>

                <div class="form-group">
                    <label for="stokBarang">Stok (Jumlah):*</label>
                    <input type="number" id="stokBarang" min="0" step="any" required placeholder="0">
                </div>

                <div class="form-group">
                    <label for="hargaBeli">Harga Beli / Modal (Rp):*</label>
                    <input type="number" id="hargaBeli" min="0" required placeholder="0">
                </div>

                <div class="form-group">
                    <label for="hargaJual">Harga Jual (Rp):*</label>
                    <input type="number" id="hargaJual" min="0" required placeholder="0">
                </div>

                <div class="form-actions" style="display: flex; gap: 10px;">
                    <button type="submit" id="btnSubmit" class="btn btn-primary" style="flex: 1;">Simpan Barang</button>
                    <button type="button" id="btnCancel" class="btn btn-secondary">Batal</button>
                </div>
            </form>
        </div>

        <!-- Filter Search & Kategori -->
        <div class="sort-box" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
            <input type="text" id="searchInput" placeholder="🔍 Cari nama barang / barcode..." style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;">
            
            <select id="filterCategory" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box;">
                <option value="">📂 Semua Kategori</option>
                <option value="Sembako">🌾 Sembako & Bahan Pokok</option>
                <option value="Mie Instan">🍜 Mie Instan & Olahan</option>
                <option value="Minuman">🥤 Minuman & Galon</option>
                <option value="Snack">🍿 Jajanan & Snack</option>
                <option value="Rokok">🚬 Rokok & Tembakau</option>
                <option value="Perlengkapan">🧼 Mandi & Cuci</option>
                <option value="Pendingin">🍦 Es Krim & Pendingin</option>
                <option value="Obat">💊 Obat & Kesehatan</option>
                <option value="Rumah Tangga">🔥 Gas & Kebutuhan Rumah</option>
                <option value="Lainnya">📦 Lain-lain</option>
            </select>
        </div>

        <div class="list-box" style="margin-top: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="margin: 0;">📦 Daftar Stok Barang</h2>
                <button id="btnWaStok" class="btn" style="background: #25D366; color: white; font-weight: bold; padding: 8px 12px; font-size: 13px;">
                    📱 Kirim List Belanja ke WA
                </button>
            </div>
            <div id="itemList"></div>
        </div>
    </div>

    <!-- Modal Pilihan Setelah Foto -->
    <div id="photoOptionModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center;">
        <div style="background: white; padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center;">
            <h3 style="margin-top: 0;">Foto Berhasil Diambil</h3>
            <p style="color: #666; font-size: 14px;">Pilih tindakan untuk foto barang ini:</p>
            
            <div id="modalPreviewBox" style="margin: 15px 0;">
                <img id="modalImagePreview" src="" alt="Preview" style="max-width: 100%; max-height: 150px; border-radius: 8px;">
            </div>

            <button id="btnOptionNew" class="btn btn-primary" style="width: 100%; margin-bottom: 10px;">➕ Tambah Barang Baru (Auto OCR)</button>
            <button id="btnOptionExisting" class="btn btn-secondary" style="width: 100%; margin-bottom: 10px;">📦 Tambah ke Barang yang Sudah Ada</button>
            <button id="btnOptionCancel" class="btn" style="width: 100%; background: #ccc;">Batal</button>

            <!-- Sub Form untuk Update Stok Barang Lama -->
            <div id="existingProductForm" style="display: none; margin-top: 15px; text-align: left; border-top: 1px solid #ddd; padding-top: 15px;">
                <div class="form-group">
                    <label for="selectExistingItem">Pilih Barang:</label>
                    <select id="selectExistingItem" style="width: 100%; padding: 8px; border-radius: 6px;"></select>
                </div>
                <div class="form-group">
                    <label for="addQtyInput">Jumlah Stok yang Ditambahkan:</label>
                    <input type="number" id="addQtyInput" min="1" value="1" style="width: 100%; padding: 8px; border-radius: 6px;">
                </div>
                <button id="btnSubmitAddStock" class="btn btn-primary" style="width: 100%;">Update Stok</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="script.js?v=8.0"></script>
</body>
</html>
