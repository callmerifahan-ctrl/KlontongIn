<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KlontongIn - Laporan</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image/logo-warungku.png">
    
    <!-- Meta PWA & iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D67A67">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="KlontongIn">
    <link rel="apple-touch-icon" href="image/logo-warungku.png">
</head>
<body>
    <div class="container">
        <!-- Header Logo -->
        <div class="header-logo" style="text-align: center; margin-bottom: 20px;">
            <img src="image/logo-warungku.png" alt="KlontongIn Logo" class="brand-logo">
            <h1>KlontongIn</h1>
        </div>

        <nav class="main-nav">
            <a href="index.html" class="nav-link">📦 Inventori</a>
            <a href="cashier.html" class="nav-link">🛒 Kasir</a>
            <a href="debts.html" class="nav-link">📝 Bon / Utang</a>
            <a href="history.html" class="nav-link">📋 Riwayat Transaksi</a>
            <a href="report.html" class="nav-link active">📊 Laporan</a>
        </nav>

        <!-- Filter Periode Laporan -->
        <div style="margin-bottom: 15px; display: flex; gap: 8px;">
            <button id="btnFilterToday" class="btn" style="flex: 1; background: #D67A67; color: white; font-weight: bold; font-size: 13px;">Hari Ini</button>
            <button id="btnFilterWeek" class="btn btn-secondary" style="flex: 1; font-size: 13px;">7 Hari</button>
            <button id="btnFilterMonth" class="btn btn-secondary" style="flex: 1; font-size: 13px;">Bulan Ini</button>
            <button id="btnFilterAll" class="btn btn-secondary" style="flex: 1; font-size: 13px;">Semua</button>
        </div>

        <div class="dashboard-box">
            <div class="dashboard-card">
                <h3>💰</h3>
                <h2 id="reportOmzet">Rp 0</h2>
                <p>Total Omzet</p>
            </div>
            <div class="dashboard-card">
                <h3>📈</h3>
                <h2 id="reportKeuntungan">Rp 0</h2>
                <p>Estimasi Keuntungan</p>
            </div>
            <div class="dashboard-card">
                <h3>🛒</h3>
                <h2 id="reportTotalTransaksi">0</h2>
                <p>Total Transaksi</p>
            </div>
            <div class="dashboard-card">
                <h3>📦</h3>
                <h2 id="reportTerjual">0</h2>
                <p>Total Item Terjual</p>
            </div>
        </div>

        <div class="report-box" style="margin-top: 20px;">
            <h2>🏆 Produk Terlaris</h2>
            <ul id="topProductsList" style="padding-left: 20px;"></ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="report.js?v=3.0"></script>
</body>
</html>
